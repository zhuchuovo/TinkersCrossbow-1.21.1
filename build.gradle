plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'mcmod.tinkerscrossbow'
version = "${minecraft_version}-${mod_version}"
base { archivesName = 'TinkersCrossbow' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'SlimeKnights'; url = 'https://dvs1.progwml6.com/files/maven' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// NeoForge 1.20.1 uses Forge's packages, FML metadata and SRG mappings.
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(name == 'gameTestServer' ? 'run-gametest' : 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { tinkers_crossbow { source sourceSets.main } }
        }
        client {
        }
        server {
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'tinkers_crossbow'
            mods { tinkers_crossbow { source sourceSets.gameTest } }
        }
    }
}

dependencies {
    minecraft "net.neoforged:forge:${minecraft_version}-${neo_version}"
    compileOnly fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}")
    compileOnly fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-${tconstruct_version}")
    runtimeOnly fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}")
    runtimeOnly fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-${tconstruct_version}")
}

// 1.20.1 loads game test structures from <gameDir>/gameteststructures as SNBT, so copy them into the run directory.
tasks.register('copyGameTestStructures', Copy) {
    from 'src/gameTest/gameteststructures'
    into project.file('run-gametest/gameteststructures')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'copyGameTestStructures'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') { expand version: mod_version }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': "Tinkers' Crossbow",
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
